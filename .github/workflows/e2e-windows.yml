name: E2E Windows

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: '0'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Prepare isolated temporary and diagnostic directories
        env:
          E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Join-Path $env:RUNNER_TEMP "idevgen-a3-windows-$env:E2E_RUN_KEY"
          if (Test-Path -LiteralPath $workspace) { throw 'The unique E2E runner workspace already exists.' }
          $temporary = Join-Path $workspace 'temp'
          $logs = Join-Path $workspace 'logs'
          $traces = Join-Path $workspace 'traces'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          New-Item -ItemType Directory -Path $temporary, $logs, $traces | Out-Null
          @("IDEVGEN_A3_TEMP=$workspace", "TEMP=$temporary", "TMP=$temporary", "TMPDIR=$temporary") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python and frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'The checked-out commit does not match GITHUB_SHA.' }
          if (Test-Path -LiteralPath 'config.json') { throw 'A fresh E2E checkout must not contain config.json.' }
          if (Test-Path -LiteralPath 'data/sessions') { throw 'A fresh E2E checkout must not contain production sessions.' }
          if (Test-Path -LiteralPath '.venv') { throw 'The isolated E2E virtual environment must not already exist.' }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip install -r backend\requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Install locked Node dependencies and the Playwright Chromium build
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run e2e:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/@playwright/test/cli.js --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const b=require('./node_modules/playwright-core/browsers.json').browsers.find(x=>x.name==='chromium'); if(!b) process.exit(1); console.log(JSON.stringify(b))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows lifecycle, suites, and source controls
        env:
          E2E_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .\scripts\e2e_harness\validate-windows.ps1 -DiffBase $env:E2E_DIFF_BASE

      - name: Retain only synthetic failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/idevgen-a3-windows-${{ github.run_id }}-${{ github.run_attempt }}/logs/**/*
            ${{ runner.temp }}/idevgen-a3-windows-${{ github.run_id }}-${{ github.run_attempt }}/traces/**/trace.zip
            ${{ runner.temp }}/idevgen-a3-windows-${{ github.run_id }}-${{ github.run_attempt }}/traces/**/error-context.md
